groups:
  - name: rr-lms-backend
    rules:
      - alert: BackendDown
        expr: up{job="rr-lms-backend"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Backend is down"
          description: "The rr-lms-backend target has been unreachable for more than 1 minute."

      - alert: HighErrorRate
        expr: |
          sum(rate(http_server_requests_seconds_count{job="rr-lms-backend", status=~"5.."}[5m]))
          /
          sum(rate(http_server_requests_seconds_count{job="rr-lms-backend"}[5m])) > 0.05
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Elevated 5xx error rate"
          description: "More than 5% of requests have returned 5xx over the last 5 minutes."

      - alert: HighP99Latency
        expr: |
          histogram_quantile(0.99,
            sum(rate(http_server_requests_seconds_bucket{job="rr-lms-backend"}[5m])) by (le)
          ) > 2
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "P99 latency above 2s"
          description: "The 99th percentile request latency has exceeded 2 seconds for 5 minutes."

      - alert: JvmHeapNearLimit
        expr: |
          jvm_memory_used_bytes{job="rr-lms-backend", area="heap"}
          / jvm_memory_max_bytes{job="rr-lms-backend", area="heap"} > 0.9
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "JVM heap usage above 90%"
          description: "Heap usage has stayed above 90% of the configured max for 5 minutes — check for a leak or raise -XX:MaxRAMPercentage."

      - alert: DiskSpaceLow
        expr: disk_free_bytes{job="rr-lms-backend"} / disk_total_bytes{job="rr-lms-backend"} < 0.1
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Backend disk space below 10%"
          description: "Free disk space on the backend host/volume has dropped below 10%."
