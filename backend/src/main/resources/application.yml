spring:
  application:
    name: rr-technosoft-lms

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/rr_lms}
    username: ${DB_USERNAME:lms_user}
    password: ${DB_PASSWORD:changeme}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000

  jpa:
    hibernate:
      ddl-auto: validate      # schema is owned by Flyway, never by Hibernate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          batch_size: 30
        order_inserts: true
        order_updates: true

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}

  mail:
    host: ${SMTP_HOST:smtp.gmail.com}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true

  servlet:
    multipart:
      max-file-size: 200MB
      max-request-size: 200MB

server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /api/v1
  compression:
    enabled: true

app:
  jwt:
    secret: ${JWT_SECRET:CHANGE_THIS_TO_A_LONG_RANDOM_SECRET_IN_PRODUCTION_ENV_VARS_MIN_256_BITS}
    access-token-expiry-ms: ${JWT_ACCESS_EXPIRY:900000}        # 15 min
    refresh-token-expiry-ms: ${JWT_REFRESH_EXPIRY:604800000}   # 7 days
    issuer: rr-technosoft-lms

  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:3000,https://lms.rrtechnosoft.com}

  aws:
    s3:
      bucket: ${S3_BUCKET:rr-technosoft-lms-media}
      region: ${AWS_REGION:ap-south-1}
      access-key: ${AWS_ACCESS_KEY_ID:}
      secret-key: ${AWS_SECRET_ACCESS_KEY:}
      presigned-url-expiry-minutes: 60

  security:
    max-login-attempts: 5
    lockout-duration-minutes: 15
    password-min-length: 8

  seed:
    enabled: ${SEED_DATA:true}
    super-admin-email: ${SUPER_ADMIN_EMAIL:superadmin@rrtechnosoft.com}
    super-admin-password: ${SUPER_ADMIN_PASSWORD:ChangeMe@123}

springdoc:
  api-docs:
    path: /docs/api-docs
  swagger-ui:
    path: /docs/swagger-ui.html
    operationsSorter: method

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized

logging:
  level:
    root: INFO
    com.rrtechnosoft.lms: DEBUG
    org.springframework.security: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

---
spring:
  config:
    activate:
      on-profile: prod
logging:
  level:
    com.rrtechnosoft.lms: INFO
    org.hibernate.SQL: WARN

---
spring:
  config:
    activate:
      on-profile: dev
  jpa:
    show-sql: true
